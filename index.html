<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>영업 파이프라인 관리</title>
<style>
  :root{
    --bg:#f4f5f7;
    --panel:#ffffff;
    --border:#e2e4e9;
    --text:#1f2430;
    --text-dim:#6b7280;
    --accent:#4f6ef7;
    --accent-dim:#eef1ff;
    --shadow:0 1px 3px rgba(20,22,30,.08), 0 1px 2px rgba(20,22,30,.04);
    --radius:12px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",-apple-system,BlinkMacSystemFont,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;}

  /* ---------- Header / Nav ---------- */
  header{
    padding:16px 28px 0;
    background:var(--panel);
    border-bottom:1px solid var(--border);
    position:sticky;
    top:0;
    z-index:30;
  }
  .header-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    flex-wrap:wrap;
    margin-bottom:12px;
  }
  h1{
    font-size:19px;
    font-weight:800;
    margin:0;
    letter-spacing:-0.01em;
    white-space:nowrap;
  }
  .header-actions{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .btn{
    border:1px solid var(--border);
    background:var(--panel);
    color:var(--text);
    padding:9px 16px;
    border-radius:8px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    transition:background .15s, border-color .15s, transform .05s;
    white-space:nowrap;
  }
  .btn:hover{background:#f6f7fa;}
  .btn:active{transform:scale(0.98);}
  .btn-primary{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
  }
  .btn-primary:hover{background:#3f5ce0;}
  .btn-danger{
    background:#fff;
    border-color:#f1c3c3;
    color:#d5453f;
  }
  .btn-danger:hover{background:#fdeeee;}
  .btn-sm{ padding:6px 11px; font-size:12px; }

  .main-nav{
    display:flex;
    gap:4px;
    overflow-x:auto;
  }
  .main-nav button{
    border:none;
    background:transparent;
    color:var(--text-dim);
    font-size:13.5px;
    font-weight:700;
    padding:10px 14px;
    cursor:pointer;
    border-bottom:2.5px solid transparent;
    white-space:nowrap;
  }
  .main-nav button:hover{ color:var(--text); }
  .main-nav button.active{
    color:var(--accent);
    border-bottom-color:var(--accent);
  }

  .error-banner{
    display:none;
    background:#fdeeee;
    border:1px solid #f1c3c3;
    color:#b3261e;
    font-size:12.5px;
    font-weight:600;
    padding:10px 14px;
    border-radius:8px;
    margin:0 0 12px;
  }
  .error-banner.show{ display:block; }
  .sync-tag{
    font-size:11px;
    font-weight:700;
    color:var(--text-dim);
    display:none;
    align-items:center;
    gap:5px;
  }
  .sync-tag.show{ display:inline-flex; }
  .loading-hint{
    padding:60px 20px;
    text-align:center;
    color:var(--text-dim);
    font-size:13px;
    font-weight:600;
  }

  main{ padding:20px 28px 48px; }
  .view{ display:none; }
  .view.active{ display:block; }

  /* ---------- Cards / KPI ---------- */
  .kpi-row{
    display:grid;
    grid-template-columns:repeat(5, minmax(150px,1fr));
    gap:12px;
    margin-bottom:18px;
  }
  .kpi-card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:14px 16px;
  }
  .kpi-card .label{ font-size:12px; color:var(--text-dim); font-weight:700; margin-bottom:6px; }
  .kpi-card .value{ font-size:21px; font-weight:800; letter-spacing:-0.01em; }
  .kpi-card .unit{ font-size:11.5px; color:var(--text-dim); font-weight:600; margin-left:2px; }
  .kpi-card.accent{ background:linear-gradient(135deg,var(--accent-dim),#f8f9ff); border-color:#dfe4ff; }
  .kpi-card.won{ background:linear-gradient(135deg,#e9faf0,#f7fffb); border-color:#c9f0da; }
  .kpi-card.warn{ background:linear-gradient(135deg,#fff6e9,#fffdf7); border-color:#f3e0bd; }

  .section-block{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:18px 20px;
    margin-bottom:18px;
  }
  .section-title{
    font-size:14.5px;
    font-weight:800;
    margin:0 0 4px;
  }
  .section-sub{
    font-size:11.5px;
    color:var(--text-dim);
    margin:0 0 14px;
  }

  /* ---------- Tables ---------- */
  .table-scroll{ overflow-x:auto; }
  table.data-table{
    width:100%;
    border-collapse:collapse;
    font-size:12.5px;
    min-width:720px;
  }
  table.data-table th{
    text-align:left;
    font-size:11.5px;
    font-weight:700;
    color:var(--text-dim);
    padding:8px 10px;
    border-bottom:1.5px solid var(--border);
    white-space:nowrap;
    background:#fafafc;
    position:sticky;
    top:0;
  }
  table.data-table td{
    padding:9px 10px;
    border-bottom:1px solid #f0f1f4;
    vertical-align:middle;
    white-space:nowrap;
  }
  table.data-table td.wrap{ white-space:normal; min-width:160px; }
  table.data-table tbody tr:hover{ background:#fafbff; }
  table.data-table tfoot td{
    font-weight:800;
    border-top:1.5px solid var(--border);
    border-bottom:none;
    background:#fafafc;
  }
  .cell-actions{ display:flex; gap:4px; }

  .badge{
    display:inline-block;
    padding:2px 9px;
    border-radius:20px;
    font-size:11px;
    font-weight:700;
    white-space:nowrap;
  }
  .badge-stage{ color:#fff; }
  .badge-status-active{ background:#eef1ff; color:#4f6ef7; }
  .badge-status-won{ background:#e6f7ed; color:#1f9d55; }
  .badge-status-lost{ background:#fdeeee; color:#d5453f; }
  .badge-status-hold{ background:#fff4e2; color:#b07a1f; }
  .badge-alert-overdue{ background:#fdeeee; color:#d5453f; }
  .badge-alert-idle{ background:#f0f1f4; color:#6b7280; }
  .badge-alert-stale{ background:#fff1e0; color:#c46a12; }
  .badge-alert-imminent{ background:#fff9db; color:#9a7b06; }
  .badge-alert-none{ color:#b3b6c0; }

  .filter-row{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-bottom:14px;
  }
  .filter-row select, .filter-row input[type=text]{
    padding:7px 10px;
    border:1px solid var(--border);
    border-radius:8px;
    font-size:12.5px;
    font-family:inherit;
    background:#fbfbfc;
  }

  .subtabs{
    display:flex;
    gap:6px;
    margin-bottom:14px;
  }
  .subtabs button{
    border:1px solid var(--border);
    background:var(--panel);
    color:var(--text-dim);
    font-size:12.5px;
    font-weight:700;
    padding:7px 14px;
    border-radius:20px;
    cursor:pointer;
  }
  .subtabs button.active{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
  }
  .subview{ display:none; }
  .subview.active{ display:block; }

  /* ---------- Guide ---------- */
  .guide-card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:16px 18px;
    margin-bottom:12px;
  }
  .guide-card h3{
    margin:0 0 4px;
    font-size:15px;
    font-weight:800;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .guide-card .prob{
    font-size:11.5px;
    font-weight:700;
    color:#fff;
    background:var(--accent);
    padding:2px 9px;
    border-radius:20px;
  }
  .guide-card .definition{ font-size:13px; color:var(--text-dim); margin:2px 0 12px; }
  .guide-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(220px,1fr));
    gap:12px;
    font-size:12px;
  }
  .guide-grid .g-label{ font-weight:700; color:var(--text-dim); margin-bottom:4px; }
  .guide-grid .g-body{ white-space:pre-line; line-height:1.6; color:var(--text); }
  .guide-grid .g-warn{ white-space:pre-line; line-height:1.6; color:#b3661e; }
  .principle-item{
    display:flex;
    gap:10px;
    padding:10px 0;
    border-bottom:1px solid #f0f1f4;
  }
  .principle-item:last-child{ border-bottom:none; }
  .principle-item .p-title{ font-weight:700; font-size:13px; margin-bottom:2px; }
  .principle-item .p-body{ font-size:12px; color:var(--text-dim); }

  /* ---------- Kanban (reused) ---------- */
  .board-wrap{ overflow-x:auto; }
  .board{
    display:grid;
    grid-auto-flow:column;
    grid-auto-columns:260px;
    gap:14px;
    align-items:start;
    min-height:50vh;
  }
  .column{
    background:#eceef2;
    border-radius:var(--radius);
    display:flex;
    flex-direction:column;
    max-height:calc(100vh - 320px);
  }
  .column-header{
    padding:12px 14px 10px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:6px;
  }
  .column-title-wrap{ display:flex; align-items:center; gap:8px; min-width:0; }
  .column-dot{ width:10px;height:10px;border-radius:50%;flex:none; }
  .column-title{ font-size:13px; font-weight:800; white-space:nowrap; }
  .column-count{
    font-size:11px; color:var(--text-dim); background:rgba(0,0,0,.05);
    padding:1px 7px; border-radius:20px; font-weight:700;
  }
  .column-totals{ padding:0 14px 10px; font-size:11px; color:var(--text-dim); line-height:1.5; }
  .column-totals b{ color:var(--text); font-weight:700; }
  .card-list{
    flex:1; overflow-y:auto; padding:2px 10px 10px;
    display:flex; flex-direction:column; gap:8px; min-height:40px;
  }
  .card-list.drag-over{
    background:rgba(79,110,247,.08);
    outline:2px dashed var(--accent);
    outline-offset:-4px;
    border-radius:8px;
  }
  .add-card-btn{
    margin:0 10px 12px; padding:9px; border:1.5px dashed #c7cad3; border-radius:8px;
    background:transparent; color:var(--text-dim); font-size:12px; font-weight:700;
    cursor:pointer; text-align:center;
  }
  .add-card-btn:hover{ border-color:var(--accent); color:var(--accent); background:#fff; }
  .deal-card{
    background:var(--panel); border:1px solid var(--border); border-radius:10px;
    padding:11px 11px 9px; box-shadow:var(--shadow); cursor:grab;
    transition:box-shadow .15s, opacity .15s;
  }
  .deal-card:hover{ box-shadow:0 4px 14px rgba(20,22,30,.12); }
  .deal-card.dragging{ opacity:.4; }
  .deal-card .deal-code{ font-size:10.5px; font-weight:700; color:var(--text-dim); }
  .deal-card .company{ font-size:13px; font-weight:700; margin:1px 0 6px; }
  .deal-card .amount{ font-size:14.5px; font-weight:800; margin-bottom:7px; }
  .deal-card .meta-row{
    display:flex; justify-content:space-between; align-items:center;
    font-size:11px; color:var(--text-dim); margin-bottom:6px;
  }
  .owner-badge{ display:inline-flex; align-items:center; gap:5px; font-weight:600; color:var(--text); }
  .owner-dot{
    width:15px;height:15px;border-radius:50%; color:#fff; font-size:8.5px;
    display:flex;align-items:center;justify-content:center; font-weight:800; flex:none;
  }
  .card-alert{ font-size:10.5px; font-weight:700; margin-bottom:6px; }
  .card-actions{
    display:flex; justify-content:flex-end; gap:6px; margin-top:6px;
    padding-top:7px; border-top:1px solid #f0f1f4;
  }
  .icon-btn{
    border:none; background:transparent; color:var(--text-dim); font-size:11px;
    font-weight:700; cursor:pointer; padding:3px 8px; border-radius:6px;
  }
  .icon-btn:hover{ background:#f0f1f4; color:var(--text); }
  .icon-btn.del:hover{ background:#fdeeee; color:#d5453f; }
  .empty-hint{ font-size:11px; color:#b3b6c0; text-align:center; padding:18px 8px; }

  /* ---------- Modal ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(20,22,30,.45);
    display:none; align-items:center; justify-content:center; z-index:100; padding:20px;
    overflow-y:auto;
  }
  .overlay.open{ display:flex; }
  .modal{
    background:#fff; border-radius:14px; width:100%; max-width:560px;
    padding:24px; box-shadow:0 20px 60px rgba(0,0,0,.25); max-height:90vh; overflow-y:auto;
    margin:auto;
  }
  .modal h2{ font-size:17px; margin:0 0 4px; font-weight:800; }
  .modal .modal-sub{ font-size:11.5px; color:var(--text-dim); margin:0 0 16px; }
  .field{ margin-bottom:13px; }
  .field label{ display:block; font-size:12px; font-weight:700; color:var(--text-dim); margin-bottom:6px; }
  .field input, .field select, .field textarea{
    width:100%; padding:9px 11px; border:1px solid var(--border); border-radius:8px;
    font-size:13px; font-family:inherit; background:#fbfbfc; color:var(--text);
  }
  .field textarea{ resize:vertical; min-height:52px; }
  .field input:focus, .field select:focus, .field textarea:focus{
    outline:none; border-color:var(--accent); background:#fff;
  }
  .field .hint{ font-size:11px; color:var(--text-dim); margin-top:4px; }
  .field-row{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .field-row3{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; }
  .modal-actions{ display:flex; justify-content:space-between; align-items:center; margin-top:18px; gap:8px; }
  .modal-actions .right{ display:flex; gap:8px; }
  .deal-preview-box{
    background:#f7f8fb; border:1px solid var(--border); border-radius:8px;
    padding:10px 12px; font-size:12px; color:var(--text-dim); margin-bottom:13px;
  }
  .deal-preview-box b{ color:var(--text); }
</style>
</head>
<body>

<header>
  <div class="header-top">
    <h1>영업 파이프라인 관리</h1>
    <div class="header-actions">
      <span class="sync-tag" id="syncTag">저장 중...</span>
      <button class="btn" id="refreshBtn">새로고침</button>
      <button class="btn btn-primary" id="newDealBtn">+ 새 딜 추가</button>
    </div>
  </div>
  <nav class="main-nav" id="mainNav">
    <button data-view="guide">📖 단계 정의 가이드</button>
    <button data-view="dashboard">📊 대시보드</button>
    <button data-view="pipeline" class="active">📋 딜 파이프라인</button>
    <button data-view="activities">📝 활동 이력</button>
    <button data-view="analysis">🔽 분석</button>
  </nav>
  <div class="error-banner" id="errorBanner"></div>
</header>

<main id="app">

  <!-- ================= 가이드 ================= -->
  <section class="view" id="view-guide">
    <div id="guideContent"></div>
  </section>

  <!-- ================= 대시보드 ================= -->
  <section class="view" id="view-dashboard">
    <div class="kpi-row" id="dashKpiRow"></div>

    <div class="section-block">
      <div class="section-title">▶ 파이프라인 단계별 현황 (진행중)</div>
      <div class="section-sub">발굴·접촉·제안·협상 단계의 사실 집계입니다.</div>
      <div class="table-scroll"><table class="data-table" id="dashStageTable"></table></div>
    </div>

    <div class="section-block">
      <div class="section-title">▶ ⚠ 점검 필요 딜 TOP 10</div>
      <div class="section-sub">위험도 순: 액션지연 → 액션일 없음 → 정체 → 임박</div>
      <div class="table-scroll"><table class="data-table" id="dashAlertTable"></table></div>
    </div>

    <div class="section-block">
      <div class="section-title">▶ 🏢 부서별 × 단계별 현황</div>
      <div class="section-sub">건수 / 금액 · 사실 집계</div>
      <div class="table-scroll"><table class="data-table" id="dashDeptTable"></table></div>
    </div>
  </section>

  <!-- ================= 딜 파이프라인 ================= -->
  <section class="view active" id="view-pipeline">
    <div class="subtabs" id="pipelineSubtabs">
      <button data-sub="table" class="active">테이블 보기</button>
      <button data-sub="kanban">칸반 보기</button>
    </div>

    <div class="subview active" id="sub-table">
      <div class="filter-row">
        <select id="filterStage"><option value="">전체 단계</option></select>
        <select id="filterDept"><option value="">전체 부서</option></select>
        <input type="text" id="filterSearch" placeholder="고객사·담당자 검색">
      </div>
      <div class="table-scroll"><table class="data-table" id="pipelineTable"></table></div>
    </div>

    <div class="subview" id="sub-kanban">
      <div class="board-wrap"><div class="board" id="board"></div></div>
    </div>
  </section>

  <!-- ================= 활동 이력 ================= -->
  <section class="view" id="view-activities">
    <div class="header-actions" style="margin-bottom:14px;">
      <button class="btn btn-primary" id="newActivityBtn">+ 활동 추가</button>
    </div>
    <div class="table-scroll"><table class="data-table" id="activitiesTable"></table></div>
  </section>

  <!-- ================= 분석 ================= -->
  <section class="view" id="view-analysis">
    <div class="section-block">
      <div class="section-title">▶ 단계별 현황 (전체 딜 · 사실 집계)</div>
      <div class="table-scroll"><table class="data-table" id="analysisStageTable"></table></div>
    </div>
    <div class="section-block">
      <div class="section-title">▶ 부서별 성과 (확정 결과 기준)</div>
      <div class="table-scroll"><table class="data-table" id="analysisDeptTable"></table></div>
    </div>
    <div class="section-block">
      <div class="section-title">▶ 담당자별 × 단계별 현황</div>
      <div class="table-scroll"><table class="data-table" id="analysisOwnerTable"></table></div>
    </div>
  </section>

</main>

<!-- ============ 딜 추가/수정 모달 ============ -->
<div class="overlay" id="overlay">
  <div class="modal">
    <h2 id="modalTitle">새 딜 추가</h2>
    <p class="modal-sub" id="modalDealCode"></p>
    <form id="dealForm">
      <div class="field-row">
        <div class="field">
          <label>고객사명</label>
          <input type="text" id="f_company" required placeholder="예: 삼성전자">
        </div>
        <div class="field">
          <label>영업부서</label>
          <select id="f_department"></select>
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label>담당자</label>
          <select id="f_owner"></select>
        </div>
        <div class="field">
          <label>파이프라인 단계</label>
          <select id="f_stage"></select>
          <div class="hint" id="f_probHint"></div>
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label>예상 수주금액 (원)</label>
          <input type="number" id="f_amount" required min="0" step="1" placeholder="0">
        </div>
        <div class="field">
          <label>예상 수주일</label>
          <input type="date" id="f_closeDate">
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label>다음 액션일</label>
          <input type="date" id="f_nextActionDate">
        </div>
        <div class="field">
          <label>확정일 (수주·실주)</label>
          <input type="date" id="f_confirmedDate">
        </div>
      </div>
      <div class="field">
        <label>다음 액션 내용</label>
        <input type="text" id="f_nextActionNote" placeholder="예: 제안서 최종본 제출">
      </div>
      <div class="field-row">
        <div class="field">
          <label>경쟁사</label>
          <input type="text" id="f_competitor" placeholder="예: A사">
        </div>
        <div class="field">
          <label>당사 경쟁우위</label>
          <input type="text" id="f_competitiveEdge" placeholder="예: 빠른 구축 일정">
        </div>
      </div>
      <div class="field">
        <label>비고 / 메모</label>
        <textarea id="f_memo" placeholder="특이사항을 기록하세요"></textarea>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn btn-danger" id="deleteBtn" style="display:none;">삭제</button>

  function todayOnly(){
    var d = new Date();
    return new Date(d.getFullYear(), d.getMonth(), d.getDate());

  function parseDateOnly(s){
    if(!s) return null;
    var parts = String(s).slice(0,10).split("-");
    if(parts.length !== 3) return null;
    return new Date(Number(parts[0]), Number(parts[1])-1, Number(parts[2]));
  }
  function daysBetween(a, b){
    return Math.round((b.getTime() - a.getTime()) / 86400000);
  }
  function ddayLabel(dday){
    if(dday === 0) return "D-Day";

  // 딜상태(자동) / 경과일(자동) / D-Day(자동) / 점검알림(자동)
  function computeDealMeta(deal){
    var stage = deal.stage;
    var statusLabel = stage === "won" ? "수주" : stage === "lost" ? "실주" : stage === "hold" ? "보류" : "진행중";
    var isActive = ACTIVE_STAGE_IDS.indexOf(stage) !== -1;
    var meta = { statusLabel:statusLabel, isActive:isActive, elapsedDays:null, dday:null, ddayText:null, alert:null };
    if(!isActive) return meta;

    var today = todayOnly();
    var updated = parseDateOnly(deal.updatedAt);
    if(updated) meta.elapsedDays = Math.max(0, daysBetween(updated, today));

    var nextDate = parseDateOnly(deal.nextActionDate);
    if(nextDate){
      var dday = daysBetween(today, nextDate);
      meta.dday = dday;
      meta.ddayText = ddayLabel(dday);
      if(dday < 0){
        meta.alert = { level:"overdue", label:"🔴 액션지연 " + (-dday) + "일", rank:0, sortDays:-dday };
      } else if(meta.elapsedDays != null && meta.elapsedDays > ALERT_STALE_DAYS){
        meta.alert = { level:"stale", label:"🟠 정체 " + meta.elapsedDays + "일", rank:2, sortDays:meta.elapsedDays };
      } else if(dday <= ALERT_IMMINENT_DAYS){
        meta.alert = { level:"imminent", label:"🟡 액션임박 " + meta.ddayText, rank:3, sortDays:dday };
      }
    } else {
      meta.alert = { level:"idle", label:"⚪ 액션일 없음 · 방치 " + (meta.elapsedDays||0) + "일", rank:1, sortDays:meta.elapsedDays||0 };
    }
    return meta;
  }

    try{
      var stagesRes = await supabaseClient.from("stages").select("*").order("sort_order", {ascending:true});
      if(stagesRes.error) throw stagesRes.error;
      var dealsRes = await supabaseClient.from("deals").select("*").order("created_at", {ascending:true});
      if(dealsRes.error) throw dealsRes.error;
      var activitiesRes = await supabaseClient.from("activities").select("*").order("activity_date", {ascending:false});
      if(activitiesRes.error) throw activitiesRes.error;

      STAGES = stagesRes.data.map(function(s){
        return { id:s.id, name:s.name, color:STAGE_COLORS[s.id] || "#9aa0ac", defaultProbability:Number(s.default_probability) };
      });
      deals = dealsRes.data.map(mapRowToDeal);
      activities = activitiesRes.data.map(mapRowToActivity);
      loaded = true;
      hideError();
      populateStaticSelects();
      renderAll();
    }catch(err){
      loaded = false;
      showError("Supabase에서 데이터를 불러오지 못했습니다: " + (err && err.message ? err.message : err));
      renderAll();
    }finally{
      setSyncing(false);
    }
  }

  async function removeDeal(id){
    setSyncing(true);
    try{
      var res = await supabaseClient.from("deals").delete().eq("id", id);
      if(res.error) throw res.error;
      deals = deals.filter(function(x){ return x.id !== id; });
      activities = activities.filter(function(x){ return x.dealId !== id; });
      hideError();
      renderAll();
    }catch(err){
      showError("삭제하지 못했습니다: " + (err && err.message ? err.message : err));
    }finally{
      setSyncing(false);
    }
  }

  async function removeActivity(id){
    setSyncing(true);
    try{
      var res = await supabaseClient.from("activities").delete().eq("id", id);
      if(res.error) throw res.error;
      activities = activities.filter(function(x){ return x.id !== id; });
      hideError();
      renderActivities();
    }catch(err){
      showError("삭제하지 못했습니다: " + (err && err.message ? err.message : err));
    }finally{
      setSyncing(false);
    }
  }

  var filterState = { stage:"", dept:"", search:"" };
  function renderPipelineFilters(){
    document.getElementById("filterStage").addEventListener("change", function(e){ filterState.stage = e.target.value; renderPipelineTable(); });
    document.getElementById("filterDept").addEventListener("change", function(e){ filterState.dept = e.target.value; renderPipelineTable(); });
    document.getElementById("filterSearch").addEventListener("input", function(e){ filterState.search = e.target.value.trim(); renderPipelineTable(); });
  }

  function filteredDeals(){
    return deals.filter(function(d){
      if(filterState.stage && d.stage !== filterState.stage) return false;
      if(filterState.dept && d.department !== filterState.dept) return false;
      if(filterState.search){
        var q = filterState.search.toLowerCase();
        var hay = (d.company||"") + " " + (d.owner||"");
        if(hay.toLowerCase().indexOf(q) === -1) return false;
      }
      return true;
    });
  }

  /* ---------- 딜 파이프라인 : 테이블 ---------- */

  function dealCodeSortKey(code){
    var m = /^D-(\d+)$/.exec(code || "");
    return m ? parseInt(m[1],10) : 999999;
  }

  function renderPipelineTable(){
    var table = document.getElementById("pipelineTable");
    if(!loaded){
      table.innerHTML = '<tbody><tr><td class="loading-hint">' + (document.getElementById("errorBanner").classList.contains("show") ? "데이터를 불러올 수 없습니다." : "Supabase에서 불러오는 중...") + '</td></tr></tbody>';
      return;
    }
    var rows = filteredDeals().slice().sort(function(a,b){ return dealCodeSortKey(a.dealCode) - dealCodeSortKey(b.dealCode); });

    var head = '<thead><tr>' +
      '<th>딜ID</th><th>고객사명</th><th>영업부서</th><th>담당자</th><th>단계</th><th>딜상태</th>' +
      '<th>예상금액</th><th>예상수주일</th><th>최종업데이트</th><th>경과일</th><th>다음액션일</th><th>D-Day</th>' +
      '<th>다음 액션 내용</th><th>경쟁사</th><th>당사 경쟁우위</th><th>확정일</th><th>비고</th><th>점검알림</th><th></th>' +
      '</tr></thead>';

    var body = "";
    if(rows.length === 0){
      body = '<tbody><tr><td colspan="19" class="loading-hint">조건에 맞는 딜이 없습니다.</td></tr></tbody>';
    } else {
      body = "<tbody>" + rows.map(function(d){
        var stage = stageById(d.stage);
        var meta = computeDealMeta(d);
        return '<tr>' +
          '<td>' + escapeHtml(d.dealCode||"-") + '</td>' +
          '<td class="wrap"><b>' + escapeHtml(d.company) + '</b></td>' +
          '<td>' + escapeHtml(d.department||"-") + '</td>' +
          '<td>' + escapeHtml(d.owner) + '</td>' +
          '<td><span class="badge badge-stage" style="background:' + stage.color + '">' + escapeHtml(stage.name) + '</span></td>' +
          '<td><span class="badge ' + statusBadgeClass(meta.statusLabel) + '">' + meta.statusLabel + '</span></td>' +
          '<td>' + won(d.amount) + '</td>' +
          '<td>' + (d.closeDate||"-") + '</td>' +
          '<td>' + (d.updatedAt ? String(d.updatedAt).slice(0,10) : "-") + '</td>' +
          '<td>' + (meta.elapsedDays!=null ? meta.elapsedDays+"일" : "-") + '</td>' +
          '<td>' + (d.nextActionDate||"-") + '</td>' +
          '<td>' + (meta.ddayText||"-") + '</td>' +
          '<td class="wrap">' + escapeHtml(d.nextActionNote||"-") + '</td>' +
          '<td>' + escapeHtml(d.competitor||"-") + '</td>' +
          '<td class="wrap">' + escapeHtml(d.competitiveEdge||"-") + '</td>' +
          '<td>' + (d.confirmedDate||"-") + '</td>' +
          '<td class="wrap">' + escapeHtml(d.memo||"-") + '</td>' +
          '<td>' + (meta.alert ? '<span class="badge '+alertBadgeClass(meta.alert.level)+'">'+meta.alert.label+'</span>' : '<span class="badge badge-alert-none">-</span>') + '</td>' +
          '<td><div class="cell-actions">' +
            '<button type="button" class="icon-btn edit-row-btn" data-id="'+d.id+'">수정</button>' +
            '<button type="button" class="icon-btn del del-row-btn" data-id="'+d.id+'">삭제</button>' +
          '</div></td>' +
        '</tr>';
      }).join("") + "</tbody>";

    table.innerHTML = head + body;

    table.querySelectorAll(".edit-row-btn").forEach(function(btn){
      btn.addEventListener("click", function(){ openModal(btn.dataset.id); });
    });
    table.querySelectorAll(".del-row-btn").forEach(function(btn){
      btn.addEventListener("click", function(){
        var d = dealById(btn.dataset.id);
        if(d && confirm('"'+d.company+'" 딜을 삭제할까요?')) removeDeal(d.id);

  /* ---------- 딜 파이프라인 : 칸반 ---------- */

  function renderKanban(){
    var board = document.getElementById("board");
    board.innerHTML = "";

    if(!loaded){
      var hint = document.createElement("div");
      hint.className = "loading-hint";
      hint.textContent = document.getElementById("errorBanner").classList.contains("show") ? "데이터를 불러올 수 없습니다." : "Supabase에서 불러오는 중...";
      board.appendChild(hint);
      return;
    }

    STAGES.forEach(function(stage){
      var stageDeals = deals.filter(function(d){ return d.stage === stage.id; });
      var amt = stageDeals.reduce(function(s,d){ return s + (Number(d.amount)||0); }, 0);

      var col = document.createElement("div");
      col.className = "column";

      var header = document.createElement("div");
      header.className = "column-header";
      header.innerHTML =
        '<div class="column-title-wrap"><span class="column-dot" style="background:'+stage.color+'"></span><span class="column-title">'+escapeHtml(stage.name)+'</span></div>' +
        '<span class="column-count">'+stageDeals.length+'</span>';
      col.appendChild(header);

      var totals = document.createElement("div");
      totals.className = "column-totals";
      totals.innerHTML = '합계 <b>'+won(amt)+'</b>';
      col.appendChild(totals);

      var list = document.createElement("div");
      list.className = "card-list";
      list.dataset.stage = stage.id;

      if(stageDeals.length === 0){
        var empty = document.createElement("div");
        empty.className = "empty-hint";
        empty.textContent = "카드를 여기로 드래그하세요";
        list.appendChild(empty);
      }
      stageDeals.forEach(function(deal){ list.appendChild(renderCard(deal)); });

      list.addEventListener("dragover", function(e){ e.preventDefault(); list.classList.add("drag-over"); });
      list.addEventListener("dragleave", function(){ list.classList.remove("drag-over"); });
      list.addEventListener("drop", function(e){
        e.preventDefault();
        list.classList.remove("drag-over");
        if(!dragDealId) return;
        var movedId = dragDealId;
        dragDealId = null;
        var d = dealById(movedId);
        if(!d || d.stage === stage.id) return;
        var prevStage = d.stage;
        var prevProb = d.probability;
        d.stage = stage.id;
        d.probability = stage.defaultProbability;
        renderAll();
        supabaseClient.from("deals").update({ stage_id: stage.id, probability: stage.defaultProbability, updated_at: new Date().toISOString() }).eq("id", movedId)
          .then(function(res){
            if(res.error){
              d.stage = prevStage;
              d.probability = prevProb;
              showError("단계 이동을 저장하지 못했습니다: " + res.error.message);
              renderAll();
            }
          });
      });

      col.appendChild(list);

      var addBtn = document.createElement("button");
      addBtn.className = "add-card-btn";
      addBtn.textContent = "+ 딜 추가";
      addBtn.addEventListener("click", function(){ openModal(null, stage.id); });
      col.appendChild(addBtn);

      board.appendChild(col);
    });
  }

  function renderCard(deal){
    var stage = stageById(deal.stage);
    var meta = computeDealMeta(deal);
    var card = document.createElement("div");
    card.className = "deal-card";
    card.draggable = true;
    card.dataset.id = deal.id;

    card.innerHTML =
      '<div class="deal-code"></div>' +
      '<div class="company"></div>' +
      '<div class="amount"></div>' +
      (meta.alert ? '<div class="card-alert"></div>' : '') +
      '<div class="meta-row"><span class="owner-badge"><span class="owner-dot"></span><span class="owner-name"></span></span><span class="due"></span></div>' +
      '<div class="card-actions"><button type="button" class="icon-btn edit-btn">수정</button><button type="button" class="icon-btn del del-btn">삭제</button></div>';

    card.querySelector(".deal-code").textContent = (deal.dealCode||"-") + " · " + (deal.department||"");
    card.querySelector(".company").textContent = deal.company;
    card.querySelector(".amount").textContent = won(deal.amount);
    if(meta.alert){
      var alertEl = card.querySelector(".card-alert");
      alertEl.textContent = meta.alert.label;
      alertEl.style.color = ({overdue:"#d5453f", idle:"#6b7280", stale:"#c46a12", imminent:"#9a7b06"})[meta.alert.level] || "#6b7280";
    }
    card.querySelector(".owner-name").textContent = deal.owner;
    var dot = card.querySelector(".owner-dot");
    dot.textContent = ownerInitial(deal.owner);
    dot.style.background = stage.color;
    card.querySelector(".due").textContent = deal.closeDate || "";

    card.addEventListener("dragstart", function(e){
      dragDealId = deal.id;
      card.classList.add("dragging");
      e.dataTransfer.effectAllowed = "move";
    });
    card.addEventListener("dragend", function(){ card.classList.remove("dragging"); });
    card.querySelector(".edit-btn").addEventListener("click", function(){ openModal(deal.id); });
    card.querySelector(".del-btn").addEventListener("click", function(){
      if(confirm('"'+deal.company+'" 딜을 삭제할까요?')) removeDeal(deal.id);
    });
    return card;
  }

  /* ---------- 딜 모달 ---------- */

  var overlay = document.getElementById("overlay");
  var form = document.getElementById("dealForm");
  var stageSelectEl = document.getElementById("f_stage");
  var ownerSelectEl = document.getElementById("f_owner");
  var deleteBtn = document.getElementById("deleteBtn");

  ownerSelectEl.addEventListener("change", function(){
    var opt = ownerSelectEl.options[ownerSelectEl.selectedIndex];
    if(opt && opt.dataset.dept) document.getElementById("f_department").value = opt.dataset.dept;
  });
  stageSelectEl.addEventListener("change", function(){
    var st = stageById(stageSelectEl.value);
    document.getElementById("f_probHint").textContent = "자동 확률: " + (st.defaultProbability!=null?st.defaultProbability:0) + "% (단계 기준값)";
  });

  function openModal(dealId, defaultStage){
    editingId = dealId;
    var deal = dealId ? dealById(dealId) : null;
    var stageForDefault = deal ? deal.stage : (defaultStage || (STAGES[0] && STAGES[0].id));

    document.getElementById("modalTitle").textContent = deal ? "딜 수정" : "새 딜 추가";
    document.getElementById("modalDealCode").textContent = deal ? (deal.dealCode||"-") : ("자동 채번 예정: " + nextDealCode());
    document.getElementById("f_company").value = deal ? deal.company : "";
    document.getElementById("f_department").value = deal ? (deal.department||DEPARTMENTS[0]) : DEPARTMENTS[0];
    document.getElementById("f_owner").value = deal ? deal.owner : (OWNERS[0] && OWNERS[0].name);
    document.getElementById("f_amount").value = deal ? deal.amount : "";
    document.getElementById("f_closeDate").value = deal ? (deal.closeDate||"") : "";
    document.getElementById("f_nextActionDate").value = deal ? (deal.nextActionDate||"") : "";
    document.getElementById("f_confirmedDate").value = deal ? (deal.confirmedDate||"") : "";
    document.getElementById("f_nextActionNote").value = deal ? (deal.nextActionNote||"") : "";
    document.getElementById("f_competitor").value = deal ? (deal.competitor||"") : "";
    document.getElementById("f_competitiveEdge").value = deal ? (deal.competitiveEdge||"") : "";
    document.getElementById("f_memo").value = deal ? (deal.memo||"") : "";
    stageSelectEl.value = stageForDefault;
    var st = stageById(stageForDefault);
    document.getElementById("f_probHint").textContent = "자동 확률: " + (st.defaultProbability!=null?st.defaultProbability:0) + "% (단계 기준값)";

    deleteBtn.style.display = deal ? "inline-block" : "none";
    overlay.classList.add("open");
    document.getElementById("f_company").focus();
  }
  function closeModal(){
    overlay.classList.remove("open");
    editingId = null;
    form.reset();
  }

  document.getElementById("newDealBtn").addEventListener("click", function(){
    openModal(null, STAGES[0] && STAGES[0].id);
  });
  document.getElementById("cancelBtn").addEventListener("click", closeModal);
  overlay.addEventListener("click", function(e){ if(e.target === overlay) closeModal(); });
  document.addEventListener("keydown", function(e){
    if(e.key === "Escape"){
      if(overlay.classList.contains("open")) closeModal();
      if(activityOverlay.classList.contains("open")) closeActivityModal();
    }
  });

  deleteBtn.addEventListener("click", function(){
    if(!editingId) return;
    var deal = dealById(editingId);
    if(deal && confirm('"'+deal.company+'" 딜을 삭제할까요?')){
      var idToRemove = editingId;
      closeModal();
      removeDeal(idToRemove);
    }
  });

  form.addEventListener("submit", async function(e){
    e.preventDefault();
    var stageId = stageSelectEl.value;
    var st = stageById(stageId);
    var data = {
      company: document.getElementById("f_company").value.trim(),
      department: document.getElementById("f_department").value,
      owner: document.getElementById("f_owner").value,
      stage: stageId,
      probability: st.defaultProbability != null ? st.defaultProbability : 0,
      amount: Number(document.getElementById("f_amount").value) || 0,
      closeDate: document.getElementById("f_closeDate").value || null,
      nextActionDate: document.getElementById("f_nextActionDate").value || null,
      confirmedDate: document.getElementById("f_confirmedDate").value || null,
      nextActionNote: document.getElementById("f_nextActionNote").value.trim(),
      competitor: document.getElementById("f_competitor").value.trim(),
      competitiveEdge: document.getElementById("f_competitiveEdge").value.trim(),
      memo: document.getElementById("f_memo").value.trim()
    };
    if(!data.company){ return; }

    var saveBtn = form.querySelector('button[type="submit"]');
    saveBtn.disabled = true;
    setSyncing(true);
    try{
      if(editingId){
        var res = await supabaseClient.from("deals").update(dealToRow(data)).eq("id", editingId).select().single();
        if(res.error) throw res.error;
        var idx = deals.findIndex(function(d){ return d.id === editingId; });
        if(idx > -1) deals[idx] = mapRowToDeal(res.data);
      } else {
        var row = dealToRow(data);
        row.deal_code = nextDealCode();
        var insertRes = await supabaseClient.from("deals").insert(row).select().single();
        if(insertRes.error) throw insertRes.error;
        deals.push(mapRowToDeal(insertRes.data));
      }
      hideError();
      closeModal();
      populateStaticSelects();
      renderAll();
    }catch(err){
      showError("저장하지 못했습니다: " + (err && err.message ? err.message : err));
    }finally{
      saveBtn.disabled = false;
      setSyncing(false);
    }
  });

  document.getElementById("refreshBtn").addEventListener("click", function(){ loadFromSupabase(); });

  /* ---------- 활동 이력 ---------- */

  var activityOverlay = document.getElementById("activityOverlay");
  var activityForm = document.getElementById("activityForm");
  var activityDeleteBtn = document.getElementById("activityDeleteBtn");
  var a_dealId = document.getElementById("a_dealId");

  function updateActivityDealPreview(){
    var deal = dealById(a_dealId.value);
    var box = document.getElementById("a_dealPreview");
    if(!deal){ box.innerHTML = "딜을 선택하면 고객사·부서·담당자가 표시됩니다."; return; }
    box.innerHTML = '<b>' + escapeHtml(deal.company) + '</b> · ' + escapeHtml(deal.department||"-") + ' · ' + escapeHtml(deal.owner);
  }
  a_dealId.addEventListener("change", updateActivityDealPreview);

  function openActivityModal(activityId){
    editingActivityId = activityId || null;
    var act = editingActivityId ? activities.find(function(a){ return a.id === editingActivityId; }) : null;
    document.getElementById("activityModalTitle").textContent = act ? "활동 수정" : "활동 추가";
    a_dealId.value = act ? act.dealId : "";
    document.getElementById("a_date").value = act ? act.activityDate : new Date().toISOString().slice(0,10);
    document.getElementById("a_type").value = act ? act.activityType : ACTIVITY_TYPES[0];
    document.getElementById("a_content").value = act ? (act.content||"") : "";
    document.getElementById("a_nextAction").value = act ? (act.nextAction||"") : "";
    document.getElementById("a_memo").value = act ? (act.memo||"") : "";
    updateActivityDealPreview();
    activityDeleteBtn.style.display = act ? "inline-block" : "none";
    activityOverlay.classList.add("open");
  }
  function closeActivityModal(){
    activityOverlay.classList.remove("open");
    editingActivityId = null;
    activityForm.reset();
  }
  document.getElementById("newActivityBtn").addEventListener("click", function(){ openActivityModal(null); });
  document.getElementById("activityCancelBtn").addEventListener("click", closeActivityModal);
  activityOverlay.addEventListener("click", function(e){ if(e.target === activityOverlay) closeActivityModal(); });

  activityDeleteBtn.addEventListener("click", function(){
    if(!editingActivityId) return;
    if(confirm("이 활동 기록을 삭제할까요?")){
      var id = editingActivityId;
      closeActivityModal();
      removeActivity(id);
    }
  });

  activityForm.addEventListener("submit", async function(e){
    e.preventDefault();
    var data = {
      dealId: a_dealId.value,
      activityDate: document.getElementById("a_date").value,
      activityType: document.getElementById("a_type").value,
      content: document.getElementById("a_content").value.trim(),
      nextAction: document.getElementById("a_nextAction").value.trim(),
      memo: document.getElementById("a_memo").value.trim()
    };
    if(!data.dealId || !data.activityDate){ return; }

    var saveBtn = activityForm.querySelector('button[type="submit"]');
    saveBtn.disabled = true;
    setSyncing(true);
    try{
      if(editingActivityId){
        var res = await supabaseClient.from("activities").update(activityToRow(data)).eq("id", editingActivityId).select().single();
        if(res.error) throw res.error;
        var idx = activities.findIndex(function(a){ return a.id === editingActivityId; });
        if(idx > -1) activities[idx] = mapRowToActivity(res.data);
      } else {
        var insertRes = await supabaseClient.from("activities").insert(activityToRow(data)).select().single();
        if(insertRes.error) throw insertRes.error;
        activities.push(mapRowToActivity(insertRes.data));
      }
      hideError();
      closeActivityModal();
      renderActivities();
    }catch(err){
      showError("저장하지 못했습니다: " + (err && err.message ? err.message : err));
    }finally{
      saveBtn.disabled = false;
      setSyncing(false);
    }
  });

  function renderActivities(){
    var table = document.getElementById("activitiesTable");
    if(!loaded){
      table.innerHTML = '<tbody><tr><td class="loading-hint">불러오는 중...</td></tr></tbody>';
      return;
    }
    var head = '<thead><tr><th>딜ID</th><th>고객사명</th><th>영업부서</th><th>담당자</th><th>활동일</th><th>활동유형</th><th>활동내용</th><th>다음액션</th><th>비고</th><th></th></tr></thead>';
    var rows = activities.slice().sort(function(a,b){ return (b.activityDate||"").localeCompare(a.activityDate||""); });
    var body;
    if(rows.length === 0){
      body = '<tbody><tr><td colspan="10" class="loading-hint">활동 기록이 없습니다.</td></tr></tbody>';
    } else {
      body = "<tbody>" + rows.map(function(a){
        var deal = dealById(a.dealId);
        return '<tr>' +
          '<td>' + escapeHtml(deal ? deal.dealCode : "-") + '</td>' +
          '<td class="wrap"><b>' + escapeHtml(deal ? deal.company : "(삭제된 딜)") + '</b></td>' +
          '<td>' + escapeHtml(deal ? deal.department : "-") + '</td>' +
          '<td>' + escapeHtml(deal ? deal.owner : "-") + '</td>' +
          '<td>' + escapeHtml(a.activityDate) + '</td>' +
          '<td>' + escapeHtml(a.activityType) + '</td>' +
          '<td class="wrap">' + escapeHtml(a.content||"-") + '</td>' +
          '<td class="wrap">' + escapeHtml(a.nextAction||"-") + '</td>' +
          '<td class="wrap">' + escapeHtml(a.memo||"-") + '</td>' +
          '<td><div class="cell-actions">' +
            '<button type="button" class="icon-btn edit-act-btn" data-id="'+a.id+'">수정</button>' +
            '<button type="button" class="icon-btn del del-act-btn" data-id="'+a.id+'">삭제</button>' +
          '</div></td>' +
        '</tr>';
      }).join("") + "</tbody>";
    }
    table.innerHTML = head + body;
    table.querySelectorAll(".edit-act-btn").forEach(function(btn){
      btn.addEventListener("click", function(){ openActivityModal(btn.dataset.id); });
    });
    table.querySelectorAll(".del-act-btn").forEach(function(btn){
      btn.addEventListener("click", function(){
        if(confirm("이 활동 기록을 삭제할까요?")) removeActivity(btn.dataset.id);
      });
    });
  }

  /* ---------- 대시보드 ---------- */

  function renderDashboard(){
    if(!loaded) return;
    var totalDeals = deals.length;
    var activeDeals = deals.filter(function(d){ return ACTIVE_STAGE_IDS.indexOf(d.stage) !== -1; });
    var activePipelineAmount = activeDeals.reduce(function(s,d){ return s + (Number(d.amount)||0); }, 0);
    var wonDeals = deals.filter(function(d){ return d.stage === "won"; });
    var wonAmount = wonDeals.reduce(function(s,d){ return s + (Number(d.amount)||0); }, 0);

    var alertDeals = activeDeals.map(function(d){ return { deal:d, meta:computeDealMeta(d) }; }).filter(function(x){ return x.meta.alert; });

    var kpis = [
      { label:"전체 딜", value:totalDeals, unit:"건", cls:"" },
      { label:"진행중 딜", value:activeDeals.length, unit:"건", cls:"accent" },
      { label:"진행중 파이프라인", value:won(activePipelineAmount), unit:"", cls:"accent" },
      { label:"수주 실적", value:wonDeals.length+"건 / "+won(wonAmount), unit:"", cls:"won" },
      { label:"점검 필요 딜", value:alertDeals.length, unit:"건", cls:"warn" }
    ];
    document.getElementById("dashKpiRow").innerHTML = kpis.map(function(k){
      return '<div class="kpi-card '+k.cls+'"><div class="label">'+k.label+'</div><div class="value">'+k.value+'<span class="unit">'+k.unit+'</span></div></div>';
    }).join("");

    // 단계별 현황 (진행중)
    var stageTable = document.getElementById("dashStageTable");
    var stageRows = ACTIVE_STAGE_IDS.map(function(sid){
      var st = stageById(sid);
      var list = activeDeals.filter(function(d){ return d.stage === sid; });
      var amt = list.reduce(function(s,d){ return s + (Number(d.amount)||0); }, 0);
      return { name:st.name, color:st.color, count:list.length, amount:amt };
    });
    var totalActiveAmt = stageRows.reduce(function(s,r){ return s+r.amount; }, 0) || 1;
    stageTable.innerHTML = '<thead><tr><th>구분</th>' + stageRows.map(function(r){ return '<th>'+r.name+'</th>'; }).join("") + '<th>합계</th></tr></thead>' +
      '<tbody>' +
      '<tr><td>딜 건수</td>' + stageRows.map(function(r){ return '<td>'+r.count+'</td>'; }).join("") + '<td><b>'+activeDeals.length+'</b></td></tr>' +
      '<tr><td>예상 금액</td>' + stageRows.map(function(r){ return '<td>'+won(r.amount)+'</td>'; }).join("") + '<td><b>'+won(totalActiveAmt===1?0:totalActiveAmt)+'</b></td></tr>' +
      '<tr><td>금액 비중</td>' + stageRows.map(function(r){ return '<td>'+Math.round(r.amount/totalActiveAmt*100)+'%</td>'; }).join("") + '<td>100%</td></tr>' +
      '</tbody>';

    // TOP10 점검 필요 딜
    var alertTable = document.getElementById("dashAlertTable");
    var sortedAlerts = alertDeals.slice().sort(function(a,b){
      if(a.meta.alert.rank !== b.meta.alert.rank) return a.meta.alert.rank - b.meta.alert.rank;
      return b.meta.alert.sortDays - a.meta.alert.sortDays;
    }).slice(0, 10);
    var alertHead = '<thead><tr><th>딜ID</th><th>고객사</th><th>영업부서</th><th>담당자</th><th>단계</th><th>예상금액</th><th>최종업데이트</th><th>경과일</th><th>다음액션일</th><th>D-Day</th><th>다음 액션 내용</th><th>점검알림</th></tr></thead>';
    var alertBody;
    if(sortedAlerts.length === 0){
      alertBody = '<tbody><tr><td colspan="12" class="loading-hint">점검이 필요한 딜이 없습니다.</td></tr></tbody>';
    } else {
      alertBody = "<tbody>" + sortedAlerts.map(function(x){
        var d = x.deal, meta = x.meta, st = stageById(d.stage);
        return '<tr>' +
          '<td>'+escapeHtml(d.dealCode||"-")+'</td>' +
          '<td class="wrap"><b>'+escapeHtml(d.company)+'</b></td>' +
          '<td>'+escapeHtml(d.department||"-")+'</td>' +
          '<td>'+escapeHtml(d.owner)+'</td>' +
          '<td><span class="badge badge-stage" style="background:'+st.color+'">'+escapeHtml(st.name)+'</span></td>' +
          '<td>'+won(d.amount)+'</td>' +
          '<td>'+(d.updatedAt?String(d.updatedAt).slice(0,10):"-")+'</td>' +
          '<td>'+(meta.elapsedDays!=null?meta.elapsedDays+"일":"-")+'</td>' +
          '<td>'+(d.nextActionDate||"-")+'</td>' +
          '<td>'+(meta.ddayText||"-")+'</td>' +
          '<td class="wrap">'+escapeHtml(d.nextActionNote||"-")+'</td>' +
          '<td><span class="badge '+alertBadgeClass(meta.alert.level)+'">'+meta.alert.label+'</span></td>' +
        '</tr>';
      }).join("") + "</tbody>";
    }
    alertTable.innerHTML = alertHead + alertBody;

    // 부서별 x 단계별 현황
    var deptTable = document.getElementById("dashDeptTable");
    var deptHead = '<thead><tr><th>영업부서</th>' + ACTIVE_STAGE_IDS.map(function(sid){ return '<th colspan="2">'+stageById(sid).name+'</th>'; }).join("") + '<th colspan="2">진행 합계</th><th colspan="2">수주</th></tr>' +
      '<tr><th></th>' + ACTIVE_STAGE_IDS.map(function(){ return '<th>건수</th><th>금액</th>'; }).join("") + '<th>건수</th><th>금액</th><th>건수</th><th>금액</th></tr></thead>';
    var deptTotals = { byStage:{}, activeCount:0, activeAmt:0, wonCount:0, wonAmt:0 };
    ACTIVE_STAGE_IDS.forEach(function(sid){ deptTotals.byStage[sid] = {count:0, amt:0}; });
    var deptRows = DEPARTMENTS.map(function(dept){
      var cells = ACTIVE_STAGE_IDS.map(function(sid){
        var list = deals.filter(function(d){ return d.department===dept && d.stage===sid; });
        var amt = list.reduce(function(s,d){ return s+(Number(d.amount)||0); },0);
        deptTotals.byStage[sid].count += list.length;
        deptTotals.byStage[sid].amt += amt;
        return { count:list.length, amt:amt };
      });
      var activeList = deals.filter(function(d){ return d.department===dept && ACTIVE_STAGE_IDS.indexOf(d.stage)!==-1; });
      var activeAmt = activeList.reduce(function(s,d){ return s+(Number(d.amount)||0); },0);
      var wonList = deals.filter(function(d){ return d.department===dept && d.stage==="won"; });
      var wonAmt = wonList.reduce(function(s,d){ return s+(Number(d.amount)||0); },0);
      deptTotals.activeCount += activeList.length;
      deptTotals.activeAmt += activeAmt;
      deptTotals.wonCount += wonList.length;
      deptTotals.wonAmt += wonAmt;
      return '<tr><td><b>'+escapeHtml(dept)+'</b></td>' +
        cells.map(function(c){ return '<td>'+(c.count||"-")+'</td><td>'+(c.amt?won(c.amt):"-")+'</td>'; }).join("") +
        '<td>'+(activeList.length||"-")+'</td><td>'+(activeAmt?won(activeAmt):"-")+'</td>' +
        '<td>'+(wonList.length||"-")+'</td><td>'+(wonAmt?won(wonAmt):"-")+'</td></tr>';
    }).join("");
    var deptFoot = '<tr><td>합계</td>' +
      ACTIVE_STAGE_IDS.map(function(sid){ return '<td>'+(deptTotals.byStage[sid].count||"-")+'</td><td>'+(deptTotals.byStage[sid].amt?won(deptTotals.byStage[sid].amt):"-")+'</td>'; }).join("") +
      '<td>'+deptTotals.activeCount+'</td><td>'+won(deptTotals.activeAmt)+'</td>' +
      '<td>'+deptTotals.wonCount+'</td><td>'+won(deptTotals.wonAmt)+'</td></tr>';
    deptTable.innerHTML = deptHead + '<tbody>' + deptRows + '</tbody><tfoot>' + deptFoot + '</tfoot>';
  }

  /* ---------- 분석 ---------- */

  function renderAnalysis(){
    if(!loaded) return;

    // 1) 단계별 현황 (전체)
    var stageTable = document.getElementById("analysisStageTable");
    var total = deals.length || 1;
    var totalAmt = deals.reduce(function(s,d){ return s+(Number(d.amount)||0); },0) || 1;
    var stageRows = STAGES.map(function(st){
      var list = deals.filter(function(d){ return d.stage===st.id; });
      var amt = list.reduce(function(s,d){ return s+(Number(d.amount)||0); },0);
      return { name:st.name, color:st.color, count:list.length, amt:amt };
    });
    var activeCount = deals.filter(function(d){ return ACTIVE_STAGE_IDS.indexOf(d.stage)!==-1; }).length;
    var activeAmt = deals.filter(function(d){ return ACTIVE_STAGE_IDS.indexOf(d.stage)!==-1; }).reduce(function(s,d){ return s+(Number(d.amount)||0); },0);
    stageTable.innerHTML = '<thead><tr><th>단계</th><th>딜 건수</th><th>금액</th><th>건수 비중</th><th>금액 비중</th></tr></thead><tbody>' +
      stageRows.map(function(r){
        return '<tr><td><span class="badge badge-stage" style="background:'+r.color+'">'+escapeHtml(r.name)+'</span></td><td>'+r.count+'</td><td>'+won(r.amt)+'</td><td>'+Math.round(r.count/total*100)+'%</td><td>'+Math.round(r.amt/totalAmt*100)+'%</td></tr>';
      }).join("") +
      '</tbody><tfoot>' +
      '<tr><td>전체 합계</td><td>'+deals.length+'</td><td>'+won(deals.reduce(function(s,d){return s+(Number(d.amount)||0);},0))+'</td><td>100%</td><td>100%</td></tr>' +
      '<tr><td>진행중 소계</td><td>'+activeCount+'</td><td>'+won(activeAmt)+'</td><td></td><td></td></tr>' +
      '</tfoot>';

    // 2) 부서별 성과
    var deptTable = document.getElementById("analysisDeptTable");
    var deptTotals = { activeCount:0, activeAmt:0, wonCount:0, wonAmt:0, lostCount:0, lostAmt:0, holdCount:0 };
    var deptRows = DEPARTMENTS.map(function(dept){
      var deptDeals = deals.filter(function(d){ return d.department===dept; });
      var activeList = deptDeals.filter(function(d){ return ACTIVE_STAGE_IDS.indexOf(d.stage)!==-1; });
      var activeAmt = activeList.reduce(function(s,d){return s+(Number(d.amount)||0);},0);
      var wonList = deptDeals.filter(function(d){ return d.stage==="won"; });
      var wonAmt = wonList.reduce(function(s,d){return s+(Number(d.amount)||0);},0);
      var lostList = deptDeals.filter(function(d){ return d.stage==="lost"; });
      var lostAmt = lostList.reduce(function(s,d){return s+(Number(d.amount)||0);},0);
      var holdList = deptDeals.filter(function(d){ return d.stage==="hold"; });
      var decided = wonList.length + lostList.length;
      var winRateCount = decided ? Math.round(wonList.length/decided*100) : null;
      var winRateAmt = (wonAmt+lostAmt) ? Math.round(wonAmt/(wonAmt+lostAmt)*100) : null;
      var avgActive = activeList.length ? Math.round(activeAmt/activeList.length) : 0;
      deptTotals.activeCount += activeList.length; deptTotals.activeAmt += activeAmt;
      deptTotals.wonCount += wonList.length; deptTotals.wonAmt += wonAmt;
      deptTotals.lostCount += lostList.length; deptTotals.lostAmt += lostAmt;
      deptTotals.holdCount += holdList.length;
      return '<tr><td><b>'+escapeHtml(dept)+'</b></td>' +
        '<td>'+(activeList.length||"-")+'</td><td>'+(activeAmt?won(activeAmt):"-")+'</td>' +
        '<td>'+(wonList.length||"-")+'</td><td>'+(wonAmt?won(wonAmt):"-")+'</td>' +
        '<td>'+(lostList.length||"-")+'</td><td>'+(lostAmt?won(lostAmt):"-")+'</td>' +
        '<td>'+(holdList.length||"-")+'</td>' +
        '<td>'+(winRateCount!=null?winRateCount+"%":"-")+'</td>' +
        '<td>'+(winRateAmt!=null?winRateAmt+"%":"-")+'</td>' +
        '<td>'+(activeList.length?won(avgActive):"-")+'</td></tr>';
    }).join("");
    var totalDecided = deptTotals.wonCount + deptTotals.lostCount;
    var totalWinRateCount = totalDecided ? Math.round(deptTotals.wonCount/totalDecided*100) : 0;
    var totalWinRateAmt = (deptTotals.wonAmt+deptTotals.lostAmt) ? Math.round(deptTotals.wonAmt/(deptTotals.wonAmt+deptTotals.lostAmt)*100) : 0;
    var totalAvg = deptTotals.activeCount ? Math.round(deptTotals.activeAmt/deptTotals.activeCount) : 0;
    deptTable.innerHTML = '<thead><tr><th>부서</th><th>진행 건수</th><th>진행 금액</th><th>수주 건수</th><th>수주 금액</th><th>실주 건수</th><th>실주 금액</th><th>보류 건수</th><th>수주율(건수)</th><th>수주율(금액)</th><th>평균 진행 딜 금액</th></tr></thead>' +
      '<tbody>' + deptRows + '</tbody>' +
      '<tfoot><tr><td>합계</td><td>'+deptTotals.activeCount+'</td><td>'+won(deptTotals.activeAmt)+'</td><td>'+deptTotals.wonCount+'</td><td>'+won(deptTotals.wonAmt)+'</td><td>'+deptTotals.lostCount+'</td><td>'+won(deptTotals.lostAmt)+'</td><td>'+deptTotals.holdCount+'</td><td>'+totalWinRateCount+'%</td><td>'+totalWinRateAmt+'%</td><td>'+won(totalAvg)+'</td></tr></tfoot>';

    // 3) 담당자별 x 단계별 현황
    var ownerTable = document.getElementById("analysisOwnerTable");
    var ownerRows = OWNERS.map(function(o){
      var ownerDeals = deals.filter(function(d){ return d.owner===o.name; });
      var stageCounts = ACTIVE_STAGE_IDS.map(function(sid){ return ownerDeals.filter(function(d){ return d.stage===sid; }).length; });
      var activeList = ownerDeals.filter(function(d){ return ACTIVE_STAGE_IDS.indexOf(d.stage)!==-1; });
      var activeAmt = activeList.reduce(function(s,d){return s+(Number(d.amount)||0);},0);
      var wonCount = ownerDeals.filter(function(d){ return d.stage==="won"; }).length;
      var lostCount = ownerDeals.filter(function(d){ return d.stage==="lost"; }).length;
      var holdCount = ownerDeals.filter(function(d){ return d.stage==="hold"; }).length;
      var decided = wonCount+lostCount;
      var winRate = decided ? Math.round(wonCount/decided*100) : null;
      var avgAmt = activeList.length ? Math.round(activeAmt/activeList.length) : 0;
      return '<tr><td><b>'+escapeHtml(o.name)+'</b></td><td>'+escapeHtml(o.dept)+'</td>' +
        stageCounts.map(function(c){ return '<td>'+(c||"-")+'</td>'; }).join("") +
        '<td>'+(activeList.length||"-")+'</td><td>'+(activeAmt?won(activeAmt):"-")+'</td>' +
        '<td>'+(wonCount||"-")+'</td><td>'+(lostCount||"-")+'</td><td>'+(holdCount||"-")+'</td>' +
        '<td>'+(winRate!=null?winRate+"%":"-")+'</td><td>'+(activeList.length?won(avgAmt):"-")+'</td></tr>';
    }).join("");
    ownerTable.innerHTML = '<thead><tr><th>담당자</th><th>소속 부서</th><th>발굴</th><th>접촉</th><th>제안</th><th>협상</th><th>진행 합계(건)</th><th>진행 금액</th><th>수주</th><th>실주</th><th>보류</th><th>수주율(건수)</th><th>평균 진행 딜 금액</th></tr></thead><tbody>' + ownerRows + '</tbody>';
  }

  loadFromSupabase();
})();
</script>
</body>
</html>
