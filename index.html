<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>영업 파이프라인 관리</title>
<style>
  :root{
    --bg:#f4f5f7;
    --panel:#ffffff;
    --border:#e2e4e9;
    --text:#1f2430;
    --text-dim:#6b7280;
    --accent:#4f6ef7;
    --accent-dim:#eef1ff;
    --shadow:0 1px 3px rgba(20,22,30,.08), 0 1px 2px rgba(20,22,30,.04);
    --radius:12px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",-apple-system,BlinkMacSystemFont,sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- Header ---------- */
  header{
    padding:20px 28px 16px;
    background:var(--panel);
    border-bottom:1px solid var(--border);
    position:sticky;
    top:0;
    z-index:20;
  }
  .header-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    flex-wrap:wrap;
    margin-bottom:16px;
  }
  h1{
    font-size:20px;
    font-weight:700;
    margin:0;
    letter-spacing:-0.01em;
  }
  .header-actions{
    display:flex;
    gap:8px;
  }
  .btn{
    border:1px solid var(--border);
    background:var(--panel);
    color:var(--text);
    padding:9px 16px;
    border-radius:8px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    transition:background .15s, border-color .15s, transform .05s;
  }
  .btn:hover{background:#f6f7fa;}
  .btn:active{transform:scale(0.98);}
  .btn-primary{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
  }
  .btn-primary:hover{background:#3f5ce0;}
  .btn-danger{
    background:#fff;
    border-color:#f1c3c3;
    color:#d5453f;
  }
  .btn-danger:hover{background:#fdeeee;}

  .summary-row{
    display:grid;
    grid-template-columns:repeat(2, minmax(220px,1fr));
    gap:12px;
    margin-bottom:14px;
  }
  .summary-card{
    background:linear-gradient(135deg,var(--accent-dim),#f8f9ff);
    border:1px solid #dfe4ff;
    border-radius:var(--radius);
    padding:14px 18px;
  }
  .summary-card .label{
    font-size:12px;
    color:var(--text-dim);
    font-weight:600;
    margin-bottom:6px;
  }
  .summary-card .value{
    font-size:24px;
    font-weight:800;
    letter-spacing:-0.02em;
  }
  .summary-card.won{
    background:linear-gradient(135deg,#e9faf0,#f7fffb);
    border-color:#c9f0da;
  }
  .summary-card .sub{
    font-size:11.5px;
    color:var(--text-dim);
    margin-top:4px;
  }

  .stage-summary{
    display:flex;
    gap:10px;
    overflow-x:auto;
    padding-bottom:2px;
  }
  .stage-chip{
    flex:1 1 0;
    min-width:150px;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:10px;
    padding:9px 12px;
  }
  .stage-chip .stage-name{
    font-size:11.5px;
    font-weight:700;
    display:flex;
    align-items:center;
    gap:6px;
    color:var(--text-dim);
    margin-bottom:4px;
  }
  .stage-chip .dot{
    width:8px;height:8px;border-radius:50%;
  }
  .stage-chip .amt{
    font-size:14px;
    font-weight:700;
  }
  .stage-chip .weighted{
    font-size:11.5px;
    color:var(--text-dim);
    margin-top:2px;
  }

  /* ---------- Board ---------- */
  .board-wrap{
    padding:20px 28px 40px;
    overflow-x:auto;
  }
  .board{
    display:grid;
    grid-auto-flow:column;
    grid-auto-columns:280px;
    gap:14px;
    align-items:start;
    min-height:60vh;
  }
  .column{
    background:#eceef2;
    border-radius:var(--radius);
    display:flex;
    flex-direction:column;
    max-height:calc(100vh - 230px);
  }
  .column-header{
    padding:12px 14px 10px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:6px;
    position:sticky;
    top:0;
  }
  .column-title-wrap{
    display:flex;
    align-items:center;
    gap:8px;
    min-width:0;
  }
  .column-dot{
    width:10px;height:10px;border-radius:50%;flex:none;
  }
  .column-title{
    font-size:13.5px;
    font-weight:800;
    white-space:nowrap;
  }
  .column-count{
    font-size:11px;
    color:var(--text-dim);
    background:rgba(0,0,0,.05);
    padding:1px 7px;
    border-radius:20px;
    font-weight:700;
  }
  .column-totals{
    padding:0 14px 10px;
    font-size:11.5px;
    color:var(--text-dim);
    line-height:1.5;
  }
  .column-totals b{
    color:var(--text);
    font-weight:700;
  }
  .card-list{
    flex:1;
    overflow-y:auto;
    padding:2px 10px 10px;
    display:flex;
    flex-direction:column;
    gap:8px;
    min-height:40px;
  }
  .card-list.drag-over{
    background:rgba(79,110,247,.08);
    outline:2px dashed var(--accent);
    outline-offset:-4px;
    border-radius:8px;
  }
  .add-card-btn{
    margin:0 10px 12px;
    padding:9px;
    border:1.5px dashed #c7cad3;
    border-radius:8px;
    background:transparent;
    color:var(--text-dim);
    font-size:12.5px;
    font-weight:700;
    cursor:pointer;
    text-align:center;
  }
  .add-card-btn:hover{
    border-color:var(--accent);
    color:var(--accent);
    background:#fff;
  }

  .deal-card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:10px;
    padding:12px 12px 10px;
    box-shadow:var(--shadow);
    cursor:grab;
    transition:box-shadow .15s, transform .1s, opacity .15s;
  }
  .deal-card:hover{
    box-shadow:0 4px 14px rgba(20,22,30,.12);
  }
  .deal-card.dragging{
    opacity:.4;
  }
  .deal-card .deal-name{
    font-size:13.5px;
    font-weight:700;
    margin-bottom:3px;
    line-height:1.35;
  }
  .deal-card .company{
    font-size:12px;
    color:var(--text-dim);
    margin-bottom:8px;
  }
  .deal-card .amount{
    font-size:15px;
    font-weight:800;
    color:var(--text);
    margin-bottom:8px;
  }
  .deal-card .meta-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:11.5px;
    color:var(--text-dim);
    margin-bottom:4px;
  }
  .owner-badge{
    display:inline-flex;
    align-items:center;
    gap:5px;
    font-weight:600;
    color:var(--text);
  }
  .owner-dot{
    width:16px;height:16px;border-radius:50%;
    background:var(--accent);
    color:#fff;
    font-size:9px;
    display:flex;align-items:center;justify-content:center;
    font-weight:800;
    flex:none;
  }
  .prob-bar-wrap{
    display:flex;
    align-items:center;
    gap:6px;
    margin-top:6px;
  }
  .prob-bar-bg{
    flex:1;
    height:5px;
    background:#eceef2;
    border-radius:4px;
    overflow:hidden;
  }
  .prob-bar-fill{
    height:100%;
    background:var(--accent);
    border-radius:4px;
  }
  .prob-text{
    font-size:11px;
    font-weight:700;
    color:var(--text-dim);
    width:32px;
    text-align:right;
    flex:none;
  }
  .card-actions{
    display:flex;
    justify-content:flex-end;
    gap:6px;
    margin-top:8px;
    padding-top:8px;
    border-top:1px solid #f0f1f4;
  }
  .icon-btn{
    border:none;
    background:transparent;
    color:var(--text-dim);
    font-size:11.5px;
    font-weight:700;
    cursor:pointer;
    padding:3px 8px;
    border-radius:6px;
  }
  .icon-btn:hover{
    background:#f0f1f4;
    color:var(--text);
  }
  .icon-btn.del:hover{
    background:#fdeeee;
    color:#d5453f;
  }
  .empty-hint{
    font-size:11.5px;
    color:#b3b6c0;
    text-align:center;
    padding:18px 8px;
  }

  /* ---------- Modal ---------- */
  .overlay{
    position:fixed;
    inset:0;
    background:rgba(20,22,30,.45);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:100;
    padding:20px;
  }
  .overlay.open{display:flex;}
  .modal{
    background:#fff;
    border-radius:14px;
    width:100%;
    max-width:420px;
    padding:24px;
    box-shadow:0 20px 60px rgba(0,0,0,.25);
    max-height:90vh;
    overflow-y:auto;
  }
  .modal h2{
    font-size:17px;
    margin:0 0 18px;
    font-weight:800;
  }
  .field{
    margin-bottom:14px;
  }
  .field label{
    display:block;
    font-size:12px;
    font-weight:700;
    color:var(--text-dim);
    margin-bottom:6px;
  }
  .field input,
  .field select{
    width:100%;
    padding:10px 11px;
    border:1px solid var(--border);
    border-radius:8px;
    font-size:13.5px;
    font-family:inherit;
    background:#fbfbfc;
    color:var(--text);
  }
  .field input:focus,
  .field select:focus{
    outline:none;
    border-color:var(--accent);
    background:#fff;
  }
  .field-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
  }
  .range-row{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .range-row input[type=range]{
    flex:1;
  }
  .range-val{
    font-size:13px;
    font-weight:800;
    color:var(--accent);
    width:40px;
    text-align:right;
  }
  .modal-actions{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:20px;
    gap:8px;
  }
  .modal-actions .right{
    display:flex;
    gap:8px;
  }

  .error-banner{
    display:none;
    background:#fdeeee;
    border:1px solid #f1c3c3;
    color:#b3261e;
    font-size:12.5px;
    font-weight:600;
    padding:10px 14px;
    border-radius:8px;
    margin-bottom:14px;
  }
  .error-banner.show{ display:block; }
  .loading-hint{
    padding:60px 20px;
    text-align:center;
    color:var(--text-dim);
    font-size:13px;
    font-weight:600;
  }
  .sync-tag{
    font-size:11px;
    font-weight:700;
    color:var(--text-dim);
    display:none;
    align-items:center;
    gap:5px;
  }
  .sync-tag.show{ display:inline-flex; }
</style>
</head>
<body>

<header>
  <div class="header-top">
    <h1>영업 파이프라인 관리</h1>
    <div class="header-actions">
      <span class="sync-tag" id="syncTag">저장 중...</span>
      <button class="btn" id="refreshBtn">새로고침</button>
      <button class="btn btn-primary" id="newDealBtn">+ 새 딜 추가</button>
    </div>
  </div>

  <div class="error-banner" id="errorBanner"></div>

  <div class="summary-row">
    <div class="summary-card">
      <div class="label">전체 파이프라인 총액</div>
      <div class="value" id="totalPipeline">-</div>
      <div class="sub">실주 제외, 진행 중인 전체 딜 금액 합계</div>
    </div>
    <div class="summary-card won">
      <div class="label">가중 예상매출 (금액 × 수주확률 합계)</div>
      <div class="value" id="totalWeighted">-</div>
      <div class="sub">실주 제외, 단계별 확률 반영 예상 매출</div>
    </div>
  </div>

  <div class="stage-summary" id="stageSummary"></div>
</header>

<div class="board-wrap">
  <div class="board" id="board"></div>
</div>

<!-- Modal -->
<div class="overlay" id="overlay">
  <div class="modal">
    <h2 id="modalTitle">새 딜 추가</h2>
    <form id="dealForm">
      <div class="field">
        <label>딜명</label>
        <input type="text" id="f_dealName" required placeholder="예: ERP 시스템 구축 계약">
      </div>
      <div class="field">
        <label>고객사</label>
        <input type="text" id="f_company" required placeholder="예: (주)한빛전자">
      </div>
      <div class="field-row">
        <div class="field">
          <label>금액 (원)</label>
          <input type="number" id="f_amount" required min="0" step="100000" placeholder="0">
        </div>
        <div class="field">
          <label>담당자</label>
          <input type="text" id="f_owner" required placeholder="예: 김민수">
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label>예상 마감일</label>
          <input type="date" id="f_closeDate" required>
        </div>
        <div class="field">
          <label>단계</label>
          <select id="f_stage"></select>
        </div>
      </div>
      <div class="field">
        <label>수주 확률 (%)</label>
        <div class="range-row">
          <input type="range" id="f_probability" min="0" max="100" step="5" value="50">
          <span class="range-val" id="probVal">50%</span>
        </div>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn btn-danger" id="deleteBtn" style="display:none;">삭제</button>
        <div class="right">
          <button type="button" class="btn" id="cancelBtn">취소</button>
          <button type="submit" class="btn btn-primary">저장</button>
        </div>
      </div>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
  "use strict";

  var SUPABASE_URL = "https://asuueoudciufikqjfbts.supabase.co";
  var SUPABASE_ANON_KEY = "sb_publishable_m0VSZ3Cl_29zOCIt59S5gQ_NiONIdlX";

  var STAGE_COLORS = {
    lead:"#9aa0ac", review:"#4f9dfd", proposal:"#7c5cf0",
    negotiation:"#f2a33d", won:"#38b76c", lost:"#e5564f"
  };

  var supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  var STAGES = [];
  var deals = [];
  var loaded = false;
  var editingId = null;
  var dragDealId = null;

  function mapRowToDeal(row){
    return {
      id: row.id,
      company: row.company,
      dealName: row.deal_name,
      amount: Number(row.amount),
      stage: row.stage_id,
      owner: row.owner,
      closeDate: row.expected_close_date,
      probability: Number(row.probability)
    };
  }

  function dealToRow(data){
    return {
      company: data.company,
      deal_name: data.dealName,
      amount: data.amount,
      stage_id: data.stage,
      owner: data.owner,
      expected_close_date: data.closeDate,
      probability: data.probability
    };
  }

  function showError(msg){
    var el = document.getElementById("errorBanner");
    el.textContent = msg;
    el.classList.add("show");
  }
  function hideError(){
    document.getElementById("errorBanner").classList.remove("show");
  }
  function setSyncing(on){
    document.getElementById("syncTag").classList.toggle("show", !!on);
  }

  async function loadFromSupabase(){
    setSyncing(true);
    try{
      var stagesRes = await supabaseClient.from("stages").select("*").order("sort_order", {ascending:true});
      if(stagesRes.error) throw stagesRes.error;
      var dealsRes = await supabaseClient.from("deals").select("*").order("created_at", {ascending:true});
      if(dealsRes.error) throw dealsRes.error;

      STAGES = stagesRes.data.map(function(s){
        return {
          id: s.id,
          name: s.name,
          color: STAGE_COLORS[s.id] || "#9aa0ac",
          defaultProbability: Number(s.default_probability)
        };
      });
      deals = dealsRes.data.map(mapRowToDeal);
      loaded = true;
      hideError();
      populateStageSelect();
      render();
    }catch(err){
      loaded = false;
      showError("Supabase에서 데이터를 불러오지 못했습니다: " + (err && err.message ? err.message : err));
      render();
    }finally{
      setSyncing(false);
    }
  }

  async function removeDeal(id){
    setSyncing(true);
    try{
      var res = await supabaseClient.from("deals").delete().eq("id", id);
      if(res.error) throw res.error;
      deals = deals.filter(function(x){ return x.id !== id; });
      hideError();
      render();
    }catch(err){
      showError("삭제하지 못했습니다: " + (err && err.message ? err.message : err));
    }finally{
      setSyncing(false);
    }
  }

  var fmtWon = new Intl.NumberFormat("ko-KR");
  function won(n){ return fmtWon.format(Math.round(n)) + "원"; }

  function stageById(id){
    for(var i=0;i<STAGES.length;i++){ if(STAGES[i].id===id) return STAGES[i]; }
    return STAGES[0] || { id:id, name:id||"-", color:"#9aa0ac", defaultProbability:0 };
  }

  function ownerInitial(name){
    return (name||"?").trim().slice(0,1);
  }

  /* ---------- Rendering ---------- */

  function render(){
    renderSummary();
    renderBoard();
  }

  function renderSummary(){
    var totalPipeline = 0, totalWeighted = 0;
    deals.forEach(function(d){
      if(d.stage !== "lost"){
        totalPipeline += Number(d.amount)||0;
        totalWeighted += (Number(d.amount)||0) * (Number(d.probability)||0) / 100;
      }
    });
    document.getElementById("totalPipeline").textContent = won(totalPipeline);
    document.getElementById("totalWeighted").textContent = won(totalWeighted);

    var stageWrap = document.getElementById("stageSummary");
    stageWrap.innerHTML = "";
    STAGES.forEach(function(stage){
      var stageDeals = deals.filter(function(d){ return d.stage === stage.id; });
      var amt = stageDeals.reduce(function(s,d){ return s + (Number(d.amount)||0); }, 0);
      var weighted = stageDeals.reduce(function(s,d){ return s + (Number(d.amount)||0)*(Number(d.probability)||0)/100; }, 0);

      var chip = document.createElement("div");
      chip.className = "stage-chip";
      chip.innerHTML =
        '<div class="stage-name"><span class="dot" style="background:'+stage.color+'"></span>'+stage.name+'</div>' +
        '<div class="amt">'+won(amt)+'</div>' +
        '<div class="weighted">가중: '+won(weighted)+'</div>';
      stageWrap.appendChild(chip);
    });
  }

  function renderBoard(){
    var board = document.getElementById("board");
    board.innerHTML = "";

    if(!loaded){
      var hint = document.createElement("div");
      hint.className = "loading-hint";
      hint.textContent = document.getElementById("errorBanner").classList.contains("show")
        ? "데이터를 불러올 수 없습니다."
        : "Supabase에서 불러오는 중...";
      board.appendChild(hint);
      return;
    }

    STAGES.forEach(function(stage){
      var stageDeals = deals.filter(function(d){ return d.stage === stage.id; });
      var amt = stageDeals.reduce(function(s,d){ return s + (Number(d.amount)||0); }, 0);
      var weighted = stageDeals.reduce(function(s,d){ return s + (Number(d.amount)||0)*(Number(d.probability)||0)/100; }, 0);

      var col = document.createElement("div");
      col.className = "column";

      var header = document.createElement("div");
      header.className = "column-header";
      header.innerHTML =
        '<div class="column-title-wrap">' +
          '<span class="column-dot" style="background:'+stage.color+'"></span>' +
          '<span class="column-title">'+stage.name+'</span>' +
        '</div>' +
        '<span class="column-count">'+stageDeals.length+'</span>';
      col.appendChild(header);

      var totals = document.createElement("div");
      totals.className = "column-totals";
      totals.innerHTML = '합계 <b>'+won(amt)+'</b> · 가중 <b>'+won(weighted)+'</b>';
      col.appendChild(totals);

      var list = document.createElement("div");
      list.className = "card-list";
      list.dataset.stage = stage.id;

      if(stageDeals.length === 0){
        var hint = document.createElement("div");
        hint.className = "empty-hint";
        hint.textContent = "카드를 여기로 드래그하세요";
        list.appendChild(hint);
      }

      stageDeals.forEach(function(deal){
        list.appendChild(renderCard(deal));
      });

      list.addEventListener("dragover", function(e){
        e.preventDefault();
        list.classList.add("drag-over");
      });
      list.addEventListener("dragleave", function(){
        list.classList.remove("drag-over");
      });
      list.addEventListener("drop", function(e){
        e.preventDefault();
        list.classList.remove("drag-over");
        if(!dragDealId) return;
        var movedId = dragDealId;
        dragDealId = null;
        var d = deals.find(function(x){ return x.id === movedId; });
        if(!d || d.stage === stage.id) return;

        var prevStage = d.stage;
        d.stage = stage.id;
        render();

        supabaseClient.from("deals").update({ stage_id: stage.id }).eq("id", movedId)
          .then(function(res){
            if(res.error){
              d.stage = prevStage;
              showError("단계 이동을 저장하지 못했습니다: " + res.error.message);
              render();
            }
          });
      });

      col.appendChild(list);

      var addBtn = document.createElement("button");
      addBtn.className = "add-card-btn";
      addBtn.textContent = "+ 딜 추가";
      addBtn.addEventListener("click", function(){ openModal(null, stage.id); });
      col.appendChild(addBtn);

      board.appendChild(col);
    });
  }

  function renderCard(deal){
    var stage = stageById(deal.stage);
    var card = document.createElement("div");
    card.className = "deal-card";
    card.draggable = true;
    card.dataset.id = deal.id;

    var dday = "";
    if(deal.closeDate){
      var diff = Math.ceil((new Date(deal.closeDate) - new Date(new Date().toDateString())) / 86400000);
      if(diff < 0) dday = "마감 지남";
      else if(diff === 0) dday = "오늘 마감";
      else dday = "D-" + diff;
    }

    card.innerHTML =
      '<div class="deal-name"></div>' +
      '<div class="company"></div>' +
      '<div class="amount"></div>' +
      '<div class="meta-row">' +
        '<span class="owner-badge"><span class="owner-dot"></span><span class="owner-name"></span></span>' +
        '<span class="due"></span>' +
      '</div>' +
      '<div class="prob-bar-wrap">' +
        '<div class="prob-bar-bg"><div class="prob-bar-fill"></div></div>' +
        '<span class="prob-text"></span>' +
      '</div>' +
      '<div class="card-actions">' +
        '<button type="button" class="icon-btn edit-btn">수정</button>' +
        '<button type="button" class="icon-btn del del-btn">삭제</button>' +
      '</div>';

    card.querySelector(".deal-name").textContent = deal.dealName;
    card.querySelector(".company").textContent = deal.company;
    card.querySelector(".amount").textContent = won(deal.amount);
    card.querySelector(".owner-name").textContent = deal.owner;
    card.querySelector(".owner-dot").textContent = ownerInitial(deal.owner);
    card.querySelector(".owner-dot").style.background = stage.color;
    card.querySelector(".due").textContent = (deal.closeDate || "") + (dday ? " · " + dday : "");
    var fill = card.querySelector(".prob-bar-fill");
    fill.style.width = (Number(deal.probability)||0) + "%";
    fill.style.background = stage.color;
    card.querySelector(".prob-text").textContent = (Number(deal.probability)||0) + "%";

    card.addEventListener("dragstart", function(e){
      dragDealId = deal.id;
      card.classList.add("dragging");
      e.dataTransfer.effectAllowed = "move";
    });
    card.addEventListener("dragend", function(){
      card.classList.remove("dragging");
    });

    card.querySelector(".edit-btn").addEventListener("click", function(){
      openModal(deal.id);
    });
    card.querySelector(".del-btn").addEventListener("click", function(){
      if(confirm('"'+deal.dealName+'" 딜을 삭제할까요?')){
        removeDeal(deal.id);
      }
    });

    return card;
  }

  /* ---------- Modal / Form ---------- */

  var overlay = document.getElementById("overlay");
  var form = document.getElementById("dealForm");
  var stageSelect = document.getElementById("f_stage");
  var probRange = document.getElementById("f_probability");
  var probVal = document.getElementById("probVal");
  var deleteBtn = document.getElementById("deleteBtn");

  function populateStageSelect(){
    stageSelect.innerHTML = "";
    STAGES.forEach(function(stage){
      var opt = document.createElement("option");
      opt.value = stage.id;
      opt.textContent = stage.name;
      stageSelect.appendChild(opt);
    });
  }

  probRange.addEventListener("input", function(){
    probVal.textContent = probRange.value + "%";
  });

  stageSelect.addEventListener("change", function(){
    if(editingId) return; // 수정 중에는 기존 확률 유지
    var st = stageById(stageSelect.value);
    probRange.value = st.defaultProbability != null ? st.defaultProbability : 50;
    probVal.textContent = probRange.value + "%";
  });

  function openModal(dealId, defaultStage){
    editingId = dealId;
    var deal = dealId ? deals.find(function(d){ return d.id === dealId; }) : null;
    var stageForDefault = deal ? deal.stage : (defaultStage || (STAGES[0] && STAGES[0].id));
    var defaultProb = deal ? deal.probability : (stageById(stageForDefault).defaultProbability != null ? stageById(stageForDefault).defaultProbability : 50);

    document.getElementById("modalTitle").textContent = deal ? "딜 수정" : "새 딜 추가";
    document.getElementById("f_dealName").value = deal ? deal.dealName : "";
    document.getElementById("f_company").value = deal ? deal.company : "";
    document.getElementById("f_amount").value = deal ? deal.amount : "";
    document.getElementById("f_owner").value = deal ? deal.owner : "";
    document.getElementById("f_closeDate").value = deal ? deal.closeDate : "";
    stageSelect.value = stageForDefault;
    probRange.value = defaultProb;
    probVal.textContent = probRange.value + "%";

    deleteBtn.style.display = deal ? "inline-block" : "none";

    overlay.classList.add("open");
    document.getElementById("f_dealName").focus();
  }

  function closeModal(){
    overlay.classList.remove("open");
    editingId = null;
    form.reset();
  }

  document.getElementById("newDealBtn").addEventListener("click", function(){
    openModal(null, STAGES[0] && STAGES[0].id);
  });
  document.getElementById("cancelBtn").addEventListener("click", closeModal);
  overlay.addEventListener("click", function(e){
    if(e.target === overlay) closeModal();
  });
  document.addEventListener("keydown", function(e){
    if(e.key === "Escape" && overlay.classList.contains("open")) closeModal();
  });

  deleteBtn.addEventListener("click", function(){
    if(!editingId) return;
    var deal = deals.find(function(d){ return d.id === editingId; });
    if(deal && confirm('"'+deal.dealName+'" 딜을 삭제할까요?')){
      var idToRemove = editingId;
      closeModal();
      removeDeal(idToRemove);
    }
  });

  form.addEventListener("submit", async function(e){
    e.preventDefault();
    var data = {
      dealName: document.getElementById("f_dealName").value.trim(),
      company: document.getElementById("f_company").value.trim(),
      amount: Number(document.getElementById("f_amount").value) || 0,
      owner: document.getElementById("f_owner").value.trim(),
      closeDate: document.getElementById("f_closeDate").value,
      stage: stageSelect.value,
      probability: Number(probRange.value)
    };
    if(!data.dealName || !data.company || !data.owner || !data.closeDate){
      return;
    }

    var saveBtn = form.querySelector('button[type="submit"]');
    saveBtn.disabled = true;
    setSyncing(true);
    try{
      if(editingId){
        var res = await supabaseClient.from("deals").update(dealToRow(data)).eq("id", editingId).select().single();
        if(res.error) throw res.error;
        var idx = deals.findIndex(function(d){ return d.id === editingId; });
        if(idx > -1) deals[idx] = mapRowToDeal(res.data);
      } else {
        var insertRes = await supabaseClient.from("deals").insert(dealToRow(data)).select().single();
        if(insertRes.error) throw insertRes.error;
        deals.push(mapRowToDeal(insertRes.data));
      }
      hideError();
      closeModal();
      render();
    }catch(err){
      showError("저장하지 못했습니다: " + (err && err.message ? err.message : err));
    }finally{
      saveBtn.disabled = false;
      setSyncing(false);
    }
  });

  document.getElementById("refreshBtn").addEventListener("click", function(){
    loadFromSupabase();
  });

  loadFromSupabase();
})();
</script>
</body>
</html>
